name: memonic_app
description: Nauka fiszkami na egzamin morski (import questions.db, SM-2).
publish_to: "none"
version: 3.0.0+14

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3: ^2.4.7
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  file_picker: ^10.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  shared_preferences_platform_interface: ^2.4.1
  http: ^1.4.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/memonic_app_seed.db
    - assets/question_images/
